<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚾ Baseball Career Simulator</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#f8fafc}
header{background:#111827;padding:18px;text-align:center;border-bottom:2px solid #334155}
.container{display:grid;grid-template-columns:320px 1fr;gap:20px;padding:20px}
.panel{background:#1e293b;border-radius:12px;padding:16px}
button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}
button:hover{background:#1d4ed8}
.log{height:560px;overflow-y:auto;background:#0b1220;border-radius:8px;padding:10px;font-size:14px;line-height:1.5}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #334155}
</style>
</head>
<body>
<header>
<h1>⚾ Baseball Career Simulator</h1>
<div>Python 프로젝트 HTML 포팅 시작 버전</div>
</header>

<div class="container">
  <div class="panel">
    <h2>선수 정보</h2>
    <div id="player"></div>
    <button onclick="newPlayer()">🎲 새 선수 생성</button>
    <button onclick="train()">🏋️ 훈련</button>
    <button onclick="playGame()">⚾ 경기 진행</button>
    <button onclick="nextSeason()">📅 다음 시즌</button>
  </div>

  <div class="panel">
    <h2>로그</h2>
    <div id="log" class="log"></div>
  </div>
</div>

<script>
const FIRST=["민준","서준","도윤","예준","시우","지호","현우","준혁"];
const LAST=["김","이","박","최","정","강","조","윤"];
const KBO=["LG 트윈스","두산 베어스","KT 위즈","SSG 랜더스","NC 다이노스","키움 히어로즈","KIA 타이거즈","삼성 라이온즈","롯데 자이언츠","한화 이글스"];

let player=null;

function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min;}

function log(msg){
  const box=document.getElementById('log');
  const line=document.createElement('div');
  line.innerHTML='['+new Date().toLocaleTimeString()+'] '+msg;
  box.prepend(line);
}

function render(){
  if(!player)return;
  document.getElementById('player').innerHTML=`
    <div class="stat"><span>이름</span><strong>${player.name}</strong></div>
    <div class="stat"><span>나이</span><strong>${player.age}</strong></div>
    <div class="stat"><span>팀</span><strong>${player.team}</strong></div>
    <div class="stat"><span>컨택</span><strong>${player.contact}</strong></div>
    <div class="stat"><span>파워</span><strong>${player.power}</strong></div>
    <div class="stat"><span>구속</span><strong>${player.velocity} km/h</strong></div>
    <div class="stat"><span>연봉</span><strong>${player.salary.toLocaleString()}만원</strong></div>
  `;
}

function newPlayer(){
  player={
    name: LAST[rand(0,LAST.length-1)] + FIRST[rand(0,FIRST.length-1)],
    age:16,
    team:'고교팀',
    contact:rand(35,60),
    power:rand(30,58),
    velocity:rand(136,150),
    salary:3000
  };
  render();
  log('🎉 신인 선수가 생성되었습니다.');
}

function train(){
  if(!player)return;
  player.contact=Math.min(99,player.contact+rand(0,2));
  player.power=Math.min(99,player.power+rand(0,1));
  render();
  log('🏋️ 훈련 완료');
}

function playGame(){
  if(!player)return;
  const hit=Math.random()<((player.contact+player.power)/200);
  if(hit){
    log('✅ 안타!');
    if(Math.random()<player.power/250){
      log('💥 홈런!');
    }
  }else{
    log('❌ 아웃');
  }
}

function nextSeason(){
  if(!player)return;
  player.age++;
  if(player.age===19){
    player.team=KBO[rand(0,KBO.length-1)];
    log('🎊 KBO 드래프트 지명!');
  }
  player.salary += rand(200,1200);
  render();
  log('📅 새 시즌 시작');
}

newPlayer();
</script>
</body>
</html>
